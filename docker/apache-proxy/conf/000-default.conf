# Tootsville Apache Load Balancer Configuration

# Enable necessary modules
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule headers_module modules/mod_headers.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule alias_module modules/mod_alias.so

# HTTP configuration - Redirect to HTTPS
<VirtualHost *:80>
    ServerName localhost
    ServerAlias tootsville.local

    # Redirect all HTTP requests to HTTPS on port 5000
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}:5000%{REQUEST_URI} [R=301,L]

    # Logging
    ErrorLog /usr/local/apache2/logs/error.log
    CustomLog /usr/local/apache2/logs/access.log combined
</VirtualHost>

# HTTPS configuration - Main load balancer (port 5000)
<VirtualHost *:5000>
    ServerName localhost
    ServerAlias tootsville.local
    ServerAdmin admin@tootsville.org

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /usr/local/apache2/conf/server.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/server.key

    # Security headers
    Header always set X-Frame-Options DENY
    Header always set X-Content-Type-Options nosniff
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Route requests to appropriate backend servers
    ProxyPreserveHost On

    # Cross-host redirections (must come BEFORE ProxyPass directives)
    # Assets
    RedirectMatch permanent ^/assets/(.*)$ //jumbo.tootsville.org/Assets/$1
    RedirectMatch permanent ^/Assets/(.*)$ //jumbo.tootsville.org/Assets/$1
    
    # External links
    RedirectMatch permanent ^/ciwta/(.*)$ https://www.ciwta.org/about/$1
    RedirectMatch permanent ^/(form.*)$ https://tootsville.adventuring.click/$1
    RedirectMatch permanent ^/(quiz.*)$ https://tootsville.adventuring.click/$1
    
    # Documentation
    RedirectMatch permanent ^/devel/docs/(.*)$ https://goethe.tootsville.org/devel/docs/$1
    RedirectMatch permanent ^/help/(.*)$ https://wiki.tootsville.org/wiki/Help_$1
    RedirectMatch permanent ^/wiki/(.*)$ https://wiki.tootsville.org/wiki/$1
    RedirectMatch permanent ^/wikiwiki/(.*)$ https://wiki.tootsville.org/wiki/$1
    
    # Social
    RedirectMatch permanent ^/members/(.*)$ https://members.tootsbook.com/members/$1
    RedirectMatch permanent ^/tootsbook/(.*)$ https://www.tootsbook.com/tootsbook/$1

    # Route dynamic content to Hunchentoot server
    ProxyPass /play/ http://tootsville-server:5000/play/
    ProxyPassReverse /play/ http://tootsville-server:5000/play/
    
    ProxyPass /users/ http://tootsville-server:5000/users/
    ProxyPassReverse /users/ http://tootsville-server:5000/users/
    
    ProxyPass /toots/ http://tootsville-server:5000/toots/
    ProxyPassReverse /toots/ http://tootsville-server:5000/toots/
    
    ProxyPass /world/ http://tootsville-server:5000/world/
    ProxyPassReverse /world/ http://tootsville-server:5000/world/
    
    ProxyPass /gossip/ http://tootsville-server:5000/gossip/
    ProxyPassReverse /gossip/ http://tootsville-server:5000/gossip/
    
    ProxyPass /meta-game/ http://tootsville-server:5000/meta-game/
    ProxyPassReverse /meta-game/ http://tootsville-server:5000/meta-game/
    
    ProxyPass /version/ http://tootsville-server:5000/version/
    ProxyPassReverse /version/ http://tootsville-server:5000/version/
    
    ProxyPass /maintenance/ http://tootsville-server:5000/maintenance/
    ProxyPassReverse /maintenance/ http://tootsville-server:5000/maintenance/
    
    ProxyPass /login/ http://tootsville-server:5000/login/
    ProxyPassReverse /login/ http://tootsville-server:5000/login/
    
    ProxyPass /favicon http://tootsville-server:5000/favicon
    ProxyPassReverse /favicon http://tootsville-server:5000/favicon

    # Serve error pages directly from load balancer (must come before ProxyPass)
    Alias /error/ /usr/local/apache2/htdocs/error/
    <Directory "/usr/local/apache2/htdocs/error">
        Require all granted
        AllowOverride All
        Options +Includes +ExecCGI
    </Directory>
    
    # Exclude error pages from proxying
    ProxyPass /error/ !

    # Proxy all other requests to Apache static server
    ProxyPass / http://apache-static:80/
    ProxyPassReverse / http://apache-static:80/

    # Handle WebSocket upgrades
    RewriteEngine On
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteRule ^(.*)$ http://tootsville-server:5000/$1 [P,L]

    # CORS headers for all requests
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-Infinity-Auth"
    Header always set Access-Control-Max-Age "3600"
    Header always set Access-Control-Allow-Credentials "true"

    # Handle preflight requests
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^(.*)$ $1 [R=200,L]

    # Error pages - use the correct Tootsville error pages
    ErrorDocument 404 /error/404.shtml
    ErrorDocument 500 /error/500.shtml
    ErrorDocument 503 /error/503.shtml
    
    # Handle proxy errors with custom error pages
    ProxyErrorOverride On
    
    # Configure proxy error handling
    ProxyPreserveHost On
    ProxyTimeout 5
    ProxyBadHeader Ignore

    # Health check endpoint
    <Location /health>
        SetHandler cgi-script
        Options +ExecCGI
    </Location>

    # Logging
    ErrorLog /usr/local/apache2/logs/error.log
    CustomLog /usr/local/apache2/logs/access.log combined
</VirtualHost>

# Default server configuration
ServerName localhost

# CGI configuration for health checks
ScriptAlias /cgi-bin/ /usr/local/apache2/cgi-bin/
<Directory "/usr/local/apache2/cgi-bin">
    AllowOverride None
    Options +ExecCGI
    Require all granted
</Directory>

# Performance tuning
Timeout 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# Security
ServerTokens Prod
ServerSignature Off
TraceEnable Off